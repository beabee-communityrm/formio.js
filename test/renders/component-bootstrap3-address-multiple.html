<div id="address" class="form-group has-feedback formio-component formio-component-address formio-component-address formio-component-multiple " ref="component">
  <label class="control-label " for="address-address">
    Address
  </label>
  <table class="table table-bordered">
    <tbody>
      <tr ref="row">
        <td>
          <div class="address-autocomplete-container">
            <input ref="searchInput" name="data[address]" type="text" class="form-control" lang="en" tabindex="0" value="" autocomplete="off" id="address-address" aria-labelledby="l-address-address" aria-describedby="e-address-address" aria-required="false">
            <i class="address-autocomplete-remove-value-icon fa fa-times" tabindex="0" role="button" aria-label="Clear" ref="removeValueIcon"></i>
          </div>
        </td>
        <td>
          <button type="button" class="btn btn-default" ref="removeRow">
            <i class="fa fa-times-circle-o"></i>
          </button>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <button class="btn btn-primary formio-button-add-another" ref="addButton"><i class="fa fa-plus"></i> Add Another</button>
        </td>
      </tr>
    </tbody>
  </table>
  <div ref="messageContainer" id="e-address-address" class="formio-errors invalid-feedback"></div>
  <div ref="messageLiveRegion" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap"></div>
</div>
