<div id="file" class="formio-form-group has-feedback formio-component formio-component-file formio-component-file formio-component-multiple " ref="component">
  <label ref="label" class="col-form-label " id="l-file-file">
    Upload
  </label>
  <ul class="list-group list-group-striped">
    <li class="list-group-item list-group-header hidden-xs hidden-sm">
      <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-9"><strong>File Name</strong></div>
        <div class="col-md-2"><strong>Size</strong></div>
      </div>
    </li>
  </ul>
  <div class="fileSelector" ref="fileDrop" role="group" aria-labelledby="l-file-file" aria-describedby="e-file-file">
    <i class="fa fa-cloud-upload" aria-hidden="true"></i> Drop files to attach,
    or
    <a href="#" ref="fileBrowse" class="browse">
      browse
    </a>
    <div ref="fileProcessingLoader" class="loader-wrapper">
      <div class="loader text-center"></div>
    </div>
  </div>
  <div class="alert alert-warning">
    <p>No storage has been set for this field. File uploads are disabled until storage is set up.</p>
  </div>
  <div ref="messageContainer" id="e-file-file" class="formio-errors invalid-feedback" role="alert"></div>
</div>
